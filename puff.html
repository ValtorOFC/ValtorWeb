<!DOCTYPE html>
<html lang="es">
<head>
    <title>Puff - Valtor Oficial</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f9f9f9;
            margin: 0;
            padding: 20px;
            text-align: center;
            color: #333;
        }
        h1 { margin: 30px 0 20px; }
        .galeria {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
            margin-bottom: 30px;
        }
        .galeria img {
            width: 120px;
            height: 120px;
            object-fit: cover;
            border-radius: 12px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }
        .btn-volver {
            display: inline-block;
            padding: 12px 28px;
            background: #6c757d;
            color: white;
            text-decoration: none;
            font-size: 1.1em;
            border-radius: 8px;
            margin: 15px;
        }
        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.9);
            justify-content: center;
            align-items: center;
            z-index: 10;
        }
        .modal img {
            max-width: 90%;
            max-height: 80%;
            border-radius: 14px;
        }
        .close {
            position: absolute;
            top: 20px;
            right: 30px;
            color: white;
            font-size: 2.5em;
            cursor: pointer;
        }
    </style>
</head>

<body>

<h1>Puff Valtor</h1>
<p>Puff para eventos, cumpleaños y hogar</p>

<div class="galeria">
    <img src="IMG-20260114-WA0009.jpg" onclick="abrir(0)">
    <img src="IMG-20260129-WA0006.jpg" onclick="abrir(1)">
    <img src="IMG-20260129-WA0008.jpg" onclick="abrir(2)">
    <img src="IMG-20260130-WA0036.jpg" onclick="abrir(3)">
    <img src="IMG-20260129-WA0007.jpg" onclick="abrir(4)">
    <img src="IMG-20260201-WA0008.jpg" onclick="abrir(5)">
</div>

<a class="btn-volver" href="index.html">← Volver al catálogo</a>

<div class="modal" id="modal">
    <span class="close" onclick="cerrar()">×</span>
    <img id="imgModal">
</div>

<script>
const fotos = [
    "IMG-20260114-WA0009.jpg",
    "IMG-20260129-WA0006.jpg",
    "IMG-20260129-WA0008.jpg",
    "IMG-20260130-WA0036.jpg",
    "IMG-20260129-WA0007.jpg",
    "IMG-20260201-WA0008.jpg"
];

function abrir(i) {
    document.getElementById("imgModal").src = fotos[i];
    document.getElementById("modal").style.display = "flex";
}

function cerrar() {
    document.getElementById("modal").style.display = "none";
}
</script>

</body>
</html>
